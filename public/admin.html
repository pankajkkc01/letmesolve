<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — letmesolve.in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <header class="nav">
    <div class="container admin-header-inner">
      <a class="nav-logo" href="/">letmesolve<span class="accent">.in</span></a>
      <span class="admin-badge">Admin</span>
      <button id="logout-btn" class="btn btn-secondary" type="button" hidden>Log out</button>
    </div>
  </header>

  <main id="main" class="container admin-main">
    <section id="login-screen" class="admin-login">
      <h1 class="section-title">Admin login</h1>
      <form id="login-form" class="admin-login-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
        <p class="form-hint admin-error" id="login-error" role="alert"></p>
      </form>
    </section>

    <section id="admin-panel" hidden>
      <div class="admin-panel-head">
        <h1 class="section-title">Case studies</h1>
        <button id="add-btn" class="btn btn-primary" type="button">+ Add case study</button>
      </div>

      <p class="form-hint" id="list-status"></p>
      <div id="admin-list" class="admin-list"></div>

      <div id="project-form-wrap" class="admin-form-wrap" hidden>
        <form id="project-form" novalidate>
          <input type="hidden" id="field-id" />
          <h2 class="section-title" id="form-title">Add case study</h2>

          <div class="form-row">
            <div class="form-field">
              <label for="field-name">Name *</label>
              <input type="text" id="field-name" required />
            </div>
            <div class="form-field">
              <label for="field-client">Client</label>
              <input type="text" id="field-client" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-industry">Industry</label>
              <input type="text" id="field-industry" />
            </div>
            <div class="form-field">
              <label for="field-role">Role</label>
              <input type="text" id="field-role" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-duration">Year / duration</label>
              <input type="text" id="field-duration" placeholder="e.g. 3 weeks, 2026" />
            </div>
            <div class="form-field">
              <label for="field-tech-tags">Tech tags</label>
              <input type="text" id="field-tech-tags" placeholder="comma-separated — Node.js, Postgres" />
            </div>
          </div>

          <div class="form-field">
            <label for="field-problem">Problem</label>
            <textarea id="field-problem" rows="3"></textarea>
          </div>
          <div class="form-field">
            <label for="field-built">Built (+ short tech line)</label>
            <textarea id="field-built" rows="3"></textarea>
          </div>
          <div class="form-field">
            <label for="field-impact">Impact</label>
            <textarea id="field-impact" rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-screenshot">Screenshot</label>
              <input type="file" id="field-screenshot" accept="image/*" />
              <img class="admin-image-preview" id="field-screenshot-preview" alt="" hidden />
            </div>
            <div class="form-field">
              <label for="field-video">Video URL</label>
              <input type="url" id="field-video" placeholder="https://..." />
            </div>
          </div>

          <div class="form-field">
            <label for="field-testimonial">Testimonial</label>
            <textarea id="field-testimonial" rows="2"></textarea>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label for="field-testimonial-name">Testimonial name</label>
              <input type="text" id="field-testimonial-name" />
            </div>
            <div class="form-field">
              <label for="field-testimonial-linkedin">Testimonial LinkedIn URL</label>
              <input type="url" id="field-testimonial-linkedin" placeholder="https://linkedin.com/in/..." />
            </div>
          </div>

          <label class="admin-toggle">
            <input type="checkbox" id="field-published" />
            <span>Published (unchecked = draft, hidden from the public site)</span>
          </label>

          <div class="admin-form-actions">
            <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
            <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          </div>
          <p class="form-hint admin-error" id="form-error" role="alert"></p>
        </form>
      </div>

      <section class="admin-section">
        <div class="admin-panel-head">
          <h1 class="section-title">Trusted by — company logos</h1>
          <button id="add-logo-btn" class="btn btn-primary" type="button">+ Add logo</button>
        </div>

        <p class="form-hint" id="logo-list-status"></p>
        <div id="logo-admin-list" class="admin-list"></div>

        <div id="logo-form-wrap" class="admin-form-wrap" hidden>
          <form id="logo-form" novalidate>
            <input type="hidden" id="logo-field-id" />
            <h2 class="section-title" id="logo-form-title">Add logo</h2>

            <div class="form-field">
              <label for="logo-field-name">Company name *</label>
              <input type="text" id="logo-field-name" required />
            </div>

            <div class="form-field">
              <label for="logo-field-file">Logo</label>
              <input type="file" id="logo-field-file" accept="image/*" />
              <img class="admin-image-preview" id="logo-field-preview" alt="" hidden />
            </div>

            <div class="form-field">
              <label for="logo-field-website">Website URL</label>
              <input type="url" id="logo-field-website" placeholder="https://..." />
              <p class="form-hint">Clicking the logo on the public site links here, in a new tab. Leave blank for a non-clickable logo.</p>
            </div>

            <label class="admin-toggle">
              <input type="checkbox" id="logo-field-published" />
              <span>Published (unchecked = draft, hidden from the public site)</span>
            </label>

            <div class="admin-form-actions">
              <button type="submit" class="btn btn-primary" id="logo-save-btn">Save</button>
              <button type="button" class="btn btn-secondary" id="logo-cancel-btn">Cancel</button>
            </div>
            <p class="form-hint admin-error" id="logo-form-error" role="alert"></p>
          </form>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" data-visible="false"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
